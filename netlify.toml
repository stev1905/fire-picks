[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Retrain scoring model every 10 days (1st, 11th, 21st) at 4 AM ET (08:00 UTC)
[functions."recalibrate-model-background"]
  schedule = "0 8 */10 * *"
